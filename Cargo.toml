[package]
name = "formula"
version = "0.0.6"
edition = "2024"
description = "A desktop editor for chemical structures and reactions"
authors = ["Arkadiy Bazhin"]
license = "MIT"
readme = "README.md"

[dependencies]
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
miniz_oxide = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

# Linux (X11 and Wayland): pictures on the clipboard, drawn from the SVG without a GPU.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
resvg = "0.45"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory"] }
# Embedded objects in Word and other programs (OLE): Formula acts as the object's editor.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_System_Threading"] }
windows-core = "0.62"

# Puts the icon and version details into the Windows program (only when building for Windows).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
strip = true

[dev-dependencies]
resvg = "0.45"
